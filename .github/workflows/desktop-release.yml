name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.1.0'
        required: true
        default: 'v1.1.0'
      prerelease:
        description: 'Mark the release as prerelease'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            label: Windows-x86_64
            executable: backend/dist/FinDataHub.exe
            artifact_glob: dist_package/*_Windows.zip
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            label: macOS-Intel
            executable: backend/dist/FinDataHub
            artifact_glob: dist_package/*_macOS_x86_64.tar.gz
          - os: macos-15
            platform: macos
            arch: arm64
            label: macOS-Apple-Silicon
            executable: backend/dist/FinDataHub
            artifact_glob: dist_package/*_macOS_arm64.tar.gz

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend assets
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import shutil

          target = pathlib.Path('backend/static')
          shutil.rmtree(target, ignore_errors=True)
          shutil.copytree('frontend/dist', target)
          PY

      - name: Install backend build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build desktop executable
        shell: bash
        working-directory: backend
        run: pyinstaller --clean build.spec

      - name: Smoke test desktop executable
        shell: bash
        run: >-
          python scripts/verify_desktop_executable.py
          --executable "${{ matrix.executable }}"
          --expected-arch "${{ matrix.arch }}"

      - name: Create release package
        shell: bash
        run: >-
          python scripts/package_desktop.py
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --version "$RELEASE_TAG"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: FinDataHub-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          files: release-assets/*
